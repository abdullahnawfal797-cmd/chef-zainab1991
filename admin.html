<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة مطعم الشيف زينب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 pb-20">

  <div class="max-w-lg mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- رأس لوحة الإدارة -->
    <div class="bg-slate-900 text-white p-5 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-black">👑 لوحة تحكم مطعم الشيف زينب</h1>
        <p class="text-xs text-slate-400">أي تعديل هنا يظهر فوراً للزبائن في الصفحة الرئيسية</p>
      </div>
      <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-xl border border-slate-700 font-bold">
        عرض المتجر 🌐
      </a>
    </div>

    <!-- نافذة تسجيل الدخول البسيطة -->
    <div id="login-section" class="p-6 space-y-4">
      <div class="text-center space-y-1">
        <h2 class="font-black text-slate-800 text-base">تسجيل الدخول للإدارة</h2>
        <p class="text-xs text-slate-500">أدخلي الرمز السري للمتابعة</p>
      </div>
      <input type="password" id="admin-pass" placeholder="••••" class="w-full border-2 border-slate-200 rounded-2xl p-3 outline-none focus:border-red-600 font-black text-center tracking-[0.5em] text-xl">
      <button onclick="login()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-red-600/30 transition-all">
        دخول
      </button>
    </div>

    <!-- المحتوى الفعلي للوحة التحكم -->
    <div id="dashboard-section" class="hidden p-5 space-y-6">
      
      <!-- حالة فتح / إغلاق المطعم -->
      <div class="border rounded-2xl p-4 bg-slate-50 flex justify-between items-center">
        <div>
          <div class="font-black text-slate-800 text-xs">حالة المطعم الحالية:</div>
          <div class="text-[11px] text-slate-500" id="status-lbl">مفتوح ويستقبل الطلبات</div>
        </div>
        <button onclick="toggleRestaurantStatus()" id="status-btn" class="px-4 py-2 rounded-xl text-xs font-black text-white bg-emerald-600">
          مفتوح الآن
        </button>
      </div>

      <!-- إعدادات المطعم -->
      <div class="border rounded-2xl p-4 bg-slate-50 space-y-3">
        <h3 class="font-black text-slate-800 text-xs">🏢 إعدادات التطبيق ورقم الواتساب:</h3>
        <div>
          <label class="block text-[11px] text-slate-500 mb-1">اسم المطعم</label>
          <input id="cfg-name" type="text" class="w-full border rounded-xl p-2 bg-white text-xs font-bold">
        </div>
        <div>
          <label class="block text-[11px] text-slate-500 mb-1">رقم الواتساب (مثال: 9647700000000)</label>
          <input id="cfg-phone" type="text" class="w-full border rounded-xl p-2 bg-white text-xs font-mono font-bold">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] text-slate-500 mb-1">سعر التوصيل (د.ع)</label>
            <input id="cfg-delivery" type="number" class="w-full border rounded-xl p-2 bg-white text-xs font-bold">
          </div>
          <div>
            <label class="block text-[11px] text-slate-500 mb-1">أوقات العمل</label>
            <input id="cfg-hours" type="text" class="w-full border rounded-xl p-2 bg-white text-xs font-bold">
          </div>
        </div>
        <div>
          <label class="block text-[11px] text-slate-500 mb-1">العنوان / النبذة</label>
          <input id="cfg-location" type="text" class="w-full border rounded-xl p-2 bg-white text-xs font-bold">
        </div>
        <button onclick="saveSettings()" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl hover:bg-slate-800 transition-all">حفظ البيانات الأساسية</button>
      </div>

      <!-- إضافة وجبة جديدة -->
      <div class="border rounded-2xl p-4 bg-slate-50 space-y-3">
        <h3 class="font-black text-slate-800 text-xs">➕ إضافة طبق جديد:</h3>
        <input id="new-title" type="text" placeholder="اسم الوجبة (مثلاً: كريسبي دجاج)" class="w-full border rounded-xl p-2 bg-white text-xs font-bold">
        <div class="grid grid-cols-2 gap-2">
          <input id="new-price" type="number" placeholder="السعر بالدينار" class="w-full border rounded-xl p-2 bg-white text-xs font-bold">
          <select id="new-cat" class="w-full border rounded-xl p-2 bg-white text-xs font-bold">
            <option value="سندويشات وبرجر">سندويشات وبرجر</option>
            <option value="أطباق شرقية">أطباق شرقية</option>
            <option value="وجبات عائلية">وجبات عائلية</option>
            <option value="مقبلات وبطاطا">مقبلات وبطاطا</option>
            <option value="مشروبات">مشروبات</option>
          </select>
        </div>
        <input id="new-desc" type="text" placeholder="الوصف والمكونات باختصار" class="w-full border rounded-xl p-2 bg-white text-xs">
        <input id="new-img" type="text" placeholder="رابط صورة الوجبة (اختياري)" class="w-full border rounded-xl p-2 bg-white text-xs">
        <button onclick="addNewMeal()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl shadow-md shadow-red-600/20">إضافة الوجبة إلى المنيو</button>
      </div>

      <!-- إدارة الوجبات الحالية -->
      <div class="space-y-3">
        <h3 class="font-black text-slate-800 text-xs">📋 تعديل وحذف الوجبات الموجودة:</h3>
        <div id="meals-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
      </div>

    </div>
  </div>

  <script>
    const CLOUD_STORAGE_KEY = 'chef_zainab_shared_database';

    const defaultData = {
      restaurant: {
        name: "مطعم الشيف زينب",
        whatsapp: "9647700000000",
        hours: "يومياً: 12:00 ظهراً - 12:00 ليلاً",
        location: "الفرع الرئيسي - طعم بيتي مميز ومأكولات سريعة",
        logo: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=160",
        deliveryFee: 2000,
        isOpen: true
      },
      items: [
        { id: 1, title: "برجر لحم الشيف الخاص", price: 5000, category: "سندويشات وبرجر", desc: "شريحة لحم طازج مع جبن شيدر وصوص خاص وخبز بريوش طري", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300", available: true },
        { id: 2, title: "قوزي لحم على تمن شرقي", price: 12000, category: "أطباق شرقية", desc: "لحم مطهو على الطريقة المنزلية مع تمن بالزعفران ومكسرات وحشو", img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=300", available: true },
        { id: 3, title: "ساندويتش فاهيتا دجاج", price: 4500, category: "سندويشات وبرجر", desc: "دجاج متبل مع خضار مشوية وجبنة موتزاريلا في خبز طازج", img: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=300", available: true },
        { id: 4, title: "بطاطا مقرمشة مبهرة", price: 1500, category: "مقبلات وبطاطا", desc: "بطاطس ذهبية ومقرمشة مع تتبيلة الشيف الخاصة وثومية", img: "https://images.unsplash.com/photo-1576107232684-1279f3908594?w=300", available: true },
        { id: 5, title: "مشروب غازي بارد منعش", price: 500, category: "مشروبات", desc: "علبة 330 مل باردة ومثلجة", img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300", available: true }
      ]
    };

    let appData = JSON.parse(localStorage.getItem(CLOUD_STORAGE_KEY)) || defaultData;

    function login() {
      const p = document.getElementById('admin-pass').value.trim();
      if (p === '1991') {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        loadForm();
        renderMeals();
      } else {
        alert('رمز الدخول غير صحيح!');
      }
    }

    function saveAll() {
      localStorage.setItem(CLOUD_STORAGE_KEY, JSON.stringify(appData));
    }

    function loadForm() {
      document.getElementById('cfg-name').value = appData.restaurant.name;
      document.getElementById('cfg-phone').value = appData.restaurant.whatsapp;
      document.getElementById('cfg-delivery').value = appData.restaurant.deliveryFee;
      document.getElementById('cfg-hours').value = appData.restaurant.hours;
      document.getElementById('cfg-location').value = appData.restaurant.location;
      updateStatusUI();
    }

    function updateStatusUI() {
      const isOpen = appData.restaurant.isOpen !== false;
      const btn = document.getElementById('status-btn');
      const lbl = document.getElementById('status-lbl');
      if (isOpen) {
        btn.innerText = "مفتوح الآن (اضغط للإغلاق)";
        btn.className = "px-4 py-2 rounded-xl text-xs font-black text-white bg-emerald-600 hover:bg-emerald-700";
        lbl.innerText = "مفتوح ويستقبل الطلبات";
      } else {
        btn.innerText = "مغلق حالياً (اضغط للفتح)";
        btn.className = "px-4 py-2 rounded-xl text-xs font-black text-white bg-red-600 hover:bg-red-700";
        lbl.innerText = "مغلق ولا يستقبل طلبات";
      }
    }

    function toggleRestaurantStatus() {
      appData.restaurant.isOpen = !(appData.restaurant.isOpen !== false);
      saveAll();
      updateStatusUI();
    }

    function saveSettings() {
      appData.restaurant.name = document.getElementById('cfg-name').value;
      appData.restaurant.whatsapp = document.getElementById('cfg-phone').value;
      appData.restaurant.deliveryFee = Number(document.getElementById('cfg-delivery').value);
      appData.restaurant.hours = document.getElementById('cfg-hours').value;
      appData.restaurant.location = document.getElementById('cfg-location').value;
      saveAll();
      alert('تم حفظ البيانات بنجاح!');
    }

    function renderMeals() {
      const list = document.getElementById('meals-list');
      list.innerHTML = appData.items.map(item => `
        <div class="border rounded-2xl p-3 bg-white flex justify-between items-center shadow-xs">
          <div>
            <div class="font-black text-slate-800 text-xs">${item.title}</div>
            <div class="text-[11px] text-slate-500 font-bold">${item.price.toLocaleString()} د.ع - <span class="text-red-700">${item.category}</span></div>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="editPrice(${item.id})" class="px-2.5 py-1 rounded-lg text-xs bg-slate-100 font-bold hover:bg-slate-200">
              تعديل السعر
            </button>
            <button onclick="toggleAvail(${item.id})" class="px-2.5 py-1 rounded-lg text-xs font-black ${item.available ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700'}">
              ${item.available ? 'متوفر' : 'نفد'}
            </button>
            <button onclick="deleteMeal(${item.id})" class="px-2 py-1 rounded-lg text-xs bg-red-50 text-red-600 hover:bg-red-100 font-bold">
              حذف
            </button>
          </div>
        </div>
      `).join('');
    }

    function editPrice(id) {
      const item = appData.items.find(i => i.id === id);
      if (item) {
        const np = prompt(`تعديل سعر (${item.title}):`, item.price);
        if (np && !isNaN(np)) {
          item.price = Number(np);
          saveAll();
          renderMeals();
        }
      }
    }

    function toggleAvail(id) {
      const item = appData.items.find(i => i.id === id);
      if (item) {
        item.available = !item.available;
        saveAll();
        renderMeals();
      }
    }

    function deleteMeal(id) {
      if (confirm('هل أنت متأكد من حذف هذه الوجبة نهائياً؟')) {
        appData.items = appData.items.filter(i => i.id !== id);
        saveAll();
        renderMeals();
      }
    }

    function addNewMeal() {
      const title = document.getElementById('new-title').value.trim();
      const price = Number(document.getElementById('new-price').value);
      const cat = document.getElementById('new-cat').value;
      const desc = document.getElementById('new-desc').value.trim();
      const img = document.getElementById('new-img').value.trim();

      if (!title || !price) return alert('يرجى إدخال اسم الوجبة وسعرها!');

      appData.items.push({
        id: Date.now(),
        title,
        price,
        category: cat,
        desc,
        img: img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=150',
        available: true
      });

      saveAll();
      document.getElementById('new-title').value = '';
      document.getElementById('new-price').value = '';
      document.getElementById('new-desc').value = '';
      document.getElementById('new-img').value = '';
      renderMeals();
      alert('تمت إضافة الوجبة بنجاح!');
    }
  </script>
</body>
</html>
