<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة مطعم الشيف زينب والشيف هادر</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-neutral-950 text-neutral-200 min-h-screen p-4 pb-20">

  <div class="max-w-lg mx-auto bg-neutral-900 rounded-3xl border border-amber-500/40 shadow-2xl overflow-hidden">
    
    <div class="bg-gradient-to-r from-amber-600 via-amber-500 to-amber-700 text-black p-5 flex justify-between items-center">
      <div>
        <h1 class="text-base font-black">👑 لوحة تحكم الشيف زينب والشيف هادر</h1>
        <p class="text-xs font-bold text-neutral-900">تعديل الأسعار وإدارة الأطباق الـ 7 والطلبات</p>
      </div>
      <a href="index.html" class="text-xs bg-black text-amber-400 px-3 py-1.5 rounded-xl font-black">
        عرض المتجر 🌐
      </a>
    </div>

    <!-- تسجيل الدخول -->
    <div id="login-box" class="p-6 space-y-4">
      <div class="text-center space-y-1">
        <h2 class="font-black text-amber-400 text-base">تسجيل الدخول للإدارة</h2>
        <p class="text-xs text-neutral-400">أدخل الرمز السري الخاص بك للمتابعة</p>
      </div>
      <input type="password" id="admin-pass" placeholder="••••" class="w-full bg-neutral-950 border border-neutral-700 rounded-2xl p-3 outline-none focus:border-amber-400 font-black text-center tracking-[0.5em] text-xl text-white">
      <button onclick="login()" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-black py-3.5 rounded-2xl shadow-lg transition-all">
        دخول
      </button>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard" class="hidden p-5 space-y-6">
      
      <!-- إعدادات الأسعار والأصناف الحالية -->
      <div class="space-y-3">
        <h3 class="font-black text-amber-400 text-xs">📋 تعديل أسعار الأطباق وتوافرها:</h3>
        <div id="meals-list" class="space-y-2.5 max-h-96 overflow-y-auto pr-1"></div>
      </div>

      <!-- إضافة طبق جديد -->
      <div class="border border-neutral-800 rounded-2xl p-4 bg-neutral-950 space-y-3">
        <h3 class="font-black text-amber-400 text-xs">➕ إضافة طبق أو عرض جديد:</h3>
        <input id="new-title" type="text" placeholder="اسم الوجبة" class="w-full bg-neutral-900 border border-neutral-700 rounded-xl p-2.5 text-xs font-bold text-white">
        <div class="grid grid-cols-2 gap-2">
          <input id="new-price" type="number" placeholder="السعر بالدينار (مثال: 5000)" class="w-full bg-neutral-900 border border-neutral-700 rounded-xl p-2.5 text-xs font-bold text-white">
          <select id="new-cat" class="w-full bg-neutral-900 border border-neutral-700 rounded-xl p-2.5 text-xs font-bold text-white">
            <option value="وجبات سريعة">وجبات سريعة</option>
            <option value="شاورما وسندويش">شاورما وسندويش</option>
            <option value="أطباق رئيسية">أطباق رئيسية</option>
            <option value="مشويات">مشويات</option>
            <option value="مقبلات وعصائر">مقبلات وعصائر</option>
          </select>
        </div>
        <input id="new-desc" type="text" placeholder="الوصف والمكونات" class="w-full bg-neutral-900 border border-neutral-700 rounded-xl p-2.5 text-xs text-white">
        <input id="new-img" type="text" placeholder="رابط صورة الوجبة" class="w-full bg-neutral-900 border border-neutral-700 rounded-xl p-2.5 text-xs text-white">
        <button onclick="addNewMeal()" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-black py-2.5 rounded-xl shadow-md">إضافة الطبق فوراً</button>
      </div>

    </div>
  </div>

  <script>
    const STORAGE_KEY = 'chef_zainab_master_store';
    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

    function login() {
      const p = document.getElementById('admin-pass').value.trim();
      if (p === '1991') {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        renderMeals();
      } else {
        alert('رمز الدخول غير صحيح!');
      }
    }

    function renderMeals() {
      const list = document.getElementById('meals-list');
      list.innerHTML = appData.items.map(item => `
        <div class="border border-neutral-800 rounded-2xl p-3 bg-neutral-950 flex justify-between items-center shadow-sm">
          <div>
            <div class="font-black text-amber-200 text-xs">${item.title}</div>
            <div class="text-[11px] text-neutral-400 font-bold mt-0.5">${item.price.toLocaleString()} د.ع - <span class="text-amber-500">${item.category}</span></div>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="editPrice(${item.id})" class="px-2.5 py-1 rounded-lg text-xs bg-neutral-800 text-amber-300 font-bold hover:bg-neutral-700">
              تعديل السعر
            </button>
            <button onclick="toggleAvail(${item.id})" class="px-2.5 py-1 rounded-lg text-xs font-black ${item.available ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800'}">
              ${item.available ? 'متوفر' : 'نفد'}
            </button>
            <button onclick="deleteMeal(${item.id})" class="px-2 py-1 rounded-lg text-xs bg-neutral-900 text-red-400 hover:bg-red-950 font-bold">
              حذف
            </button>
          </div>
        </div>
      `).join('');
    }

    function editPrice(id) {
      const item = appData.items.find(i => i.id === id);
      if (item) {
        const np = prompt(`أدخل السعر الجديد لـ (${item.title}):`, item.price);
        if (np !== null && !isNaN(np)) {
          item.price = Number(np);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
          renderMeals();
        }
      }
    }

    function toggleAvail(id) {
      const item = appData.items.find(i => i.id === id);
      if (item) {
        item.available = !item.available;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        renderMeals();
      }
    }

    function deleteMeal(id) {
      if (confirm('هل أنت متأكد من حذف هذا الطبق؟')) {
        appData.items = appData.items.filter(i => i.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        renderMeals();
      }
    }

    function addNewMeal() {
      const title = document.getElementById('new-title').value.trim();
      const price = Number(document.getElementById('new-price').value);
      const cat = document.getElementById('new-cat').value;
      const desc = document.getElementById('new-desc').value.trim();
      const img = document.getElementById('new-img').value.trim();

      if (!title || isNaN(price)) return alert('يرجى كتابة اسم الوجبة وسعرها!');

      appData.items.push({
        id: Date.now(),
        title,
        price,
        category: cat,
        desc,
        img: img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400',
        available: true
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      document.getElementById('new-title').value = '';
      document.getElementById('new-price').value = '';
      document.getElementById('new-desc').value = '';
      document.getElementById('new-img').value = '';
      renderMeals();
      alert('تمت إضافة الطبق بنجاح!');
    }
  </script>
</body>
</html>
